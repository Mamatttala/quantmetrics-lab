[project]
name = "quantmetrics-lab-backend"
version = "0.1.0"
description = "Quantmetrics Lab — local quantitative finance research backend"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # Pinned below the next major: the code and its tests encode pandas 2.x
    # semantics (nanosecond datetime resolution on a Parquet round trip, `object`
    # dtype for string columns, the ADF output shape). pandas 3.0 changes those,
    # and a bare `>=2.2` would let a fresh install pull a version that silently
    # changes the engine's output types rather than failing loud.
    "pandas>=2.2,<3",
    "numpy>=2.1",
    "scipy>=1.14",
    # >=0.15: the ADF call passes result_object=False, which only exists from there.
    "statsmodels>=0.15",
    "arch>=7.2",
    "xgboost>=3.0",
    "scikit-learn>=1.5",
    "pyarrow>=18.0",
    "duckdb>=1.1",
    "yfinance>=0.2.50",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    # Drives the real-browser checks (tools/verify_theme.py). Needs a one-time
    # `python -m playwright install chromium` for the browser binary.
    "playwright>=1.60",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Third-party stacks without complete stubs; we do not want silence elsewhere.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arch.*", "statsmodels.*", "yfinance.*", "duckdb.*", "xgboost.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::FutureWarning"]
markers = [
    "e2e: drives the running app over HTTP and a real browser; needs QM_E2E=1",
]
